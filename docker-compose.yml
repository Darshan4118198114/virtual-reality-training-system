version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vr_admin
      POSTGRES_PASSWORD: vr_password
      POSTGRES_DB: vr_training_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://vr_admin:vr_password@db:5432/vr_training_db
      - SECRET_KEY=supersecretkey_change_in_production
    depends_on:
      - db

volumes:
  postgres_data:
